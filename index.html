<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CS2 Menajer</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: #f9fafb;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    h1 { color: #f59e0b; }
    button {
      font-size: 18px;
      padding: 12px 24px;
      border: 0;
      border-radius: 8px;
      background: #f59e0b;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div>
    <h1>CS2 Menajer</h1>
    <p>Sayfa çalışıyor.</p>
    <button onclick="document.getElementById('sonuc').textContent = 'JavaScript de çalışıyor!'">
      Test Et
    </button>
    <p id="sonuc"></p>
  </div>
</body>
</html>
